name: CI (newest releases)

# The test suite against the newest releases of every dependency, without
# constraints/ci.txt: a new upstream release that breaks Twin4Build turns this
# red (python-dateutil 3.0.0, pyparsing 3.3.3, brickschema 0.8.0 did), while the
# pull requests keep testing the frozen set.  Then cap the release in
# pyproject.toml or fix the code, and refresh constraints/ci.txt.

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} (newest)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools (newest releases)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Installed versions
        run: python -m pip freeze
      - name: Run discovered test suite
        run: python -m unittest discover twin4build/tests/ -v
