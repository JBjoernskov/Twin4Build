name: CI

on:
  # Pull requests are covered by the pull_request event.  Without a branch
  # filter here, every push to a PR branch ran the whole matrix a second
  # time: two independent chances of hitting a transient runner failure and
  # two conflicting statuses per job name.
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# A new push supersedes the run it interrupts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Graphviz (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          # The hosted image ships third-party apt lists (Google Chrome) whose
          # index intermittently fails its hash check, and apt-get update
          # exits 100 when any list fails -- killing the job before a single
          # test runs.  graphviz is in the Ubuntu archives, so drop the
          # third-party lists and retry the fetch.
          sudo rm -f /etc/apt/sources.list.d/*google-chrome*.list
          sudo add-apt-repository -y universe
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends graphviz
      - name: Install Graphviz (Windows)
        if: runner.os == 'Windows'
        run: choco install graphviz --no-progress
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check syntax and undefined names
        run: python -m flake8 . --count --select="E9,F63,F7,F82" --show-source --statistics
      - name: Run discovered test suite
        run: python -m unittest discover twin4build/tests/ -v

  docs-and-package:
    name: Documentation and package
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          # The hosted image ships third-party apt lists (Google Chrome) whose
          # index intermittently fails its hash check, and apt-get update
          # exits 100 when any list fails -- killing the job before a single
          # test runs.  graphviz is in the Ubuntu archives, so drop the
          # third-party lists and retry the fetch.
          sudo rm -f /etc/apt/sources.list.d/*google-chrome*.list
          sudo add-apt-repository -y universe
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends graphviz
      - name: Install package and release tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" build
      - name: Generate API reference
        working-directory: docs
        run: make buildapi
      - name: Build documentation with warnings as errors
        working-directory: docs
        run: make html SPHINXOPTS="-W --keep-going"
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
