name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Graphviz (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install Graphviz (Windows)
        if: runner.os == 'Windows'
        run: choco install graphviz --no-progress
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check syntax and undefined names
        run: python -m flake8 . --count --select="E9,F63,F7,F82" --show-source --statistics
      - name: Run discovered test suite
        run: python -m unittest discover twin4build/tests/ -v

  docs-and-package:
    name: Documentation and package
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install package and release tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" build
      - name: Generate API reference
        working-directory: docs
        run: make buildapi
      - name: Build documentation with warnings as errors
        working-directory: docs
        run: make html SPHINXOPTS="-W --keep-going"
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
